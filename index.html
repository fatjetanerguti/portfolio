  const d = el('div', 'tools');
  list.forEach(([k, l]) => { const b = el('button', 'edit', 'Edit ' + l); b.onclick = () => editor(k); d.append(b); });
  parent.append(d);
}
let T = {};
function sec(id) {
  const r = T[id] || [], s = el('section', 'sec w'); s.id = id;
  const h = el('div', 'sh'); h.append(el('p', 'eb', r[1] || ''));
  const t = el('h2'); t.append((r[2] || '') + ' ', el('span', 'vi', r[3] || '')); h.append(t); s.append(h); return s;
}
function link(t, u) { const a = el('a', 0, t); a.href = safe(u); a.target = '_blank'; a.rel = 'noopener noreferrer'; return a; }

  const F = el('figure'), arch = el('div', 'arch');
  const ph = h[6] || (data['hero'].split('\n')[6] || '').trim(); if (imgOk(ph)) { const i = el('img'); i.src = ph; i.alt = 'Portrait of Fatjeta Nerguti'; arch.append(i); } else arch.textContent = 'FN';
  const cap = el('figcaption'); cap.append(el('span', 0, M[0] || ''), el('i', 0, M[1] || ''));
  F.append(arch, el('span', 'tag', M[2] || ''), cap); hero.append(L, F); A.append(hero);
  const st = el('div', 'strip w'); (h[5] || '').split(',').forEach(v => st.append(el('span', 0, v.trim()))); A.append(st);
  /* about */
  const ab = sec('about');
  const two = el('div', 'two'), pl = el('div'), win = el('div', 'win'), dots = el('div', 'd');
  dots.append(el('i'), el('i'), el('i')); win.append(dots);
  [92, 70, 84, 46, 78, 60].forEach(w => { const b = el('div', 'b'); b.style.width = w + '%'; win.append(b); });
  pl.append(win, el('p', 'cap', 'Where the ideas become code'));
  const tx = el('div', 'txt'); lines(g('about')).forEach(p => tx.append(el('p', 0, p)));
  const ch = el('div', 'chips'); g('skills').split(',').map(s => s.trim()).filter(Boolean).forEach(s => ch.append(el('span', 'chip', s)));
  const sts = el('div', 'stats'); rows(g('stats')).forEach(([n, l]) => { const d = el('div'); d.append(el('b', 0, n), el('span', 0, l || '')); sts.append(d); });
  tx.append(ch, sts); tools(tx, [['about', 'text'], ['skills', 'skills'], ['stats', 'numbers']]); two.append(pl, tx);
  ab.append(two); A.append(ab);
  /* projects */
  const pr = sec('projects'), pl2 = el('div', 'plist');
  rowsL('projects').forEach(([t, d, tg, y, u, im], i) => {
    const c = el('article', 'pcard'), v = el('div', 'pv');
    if (imgOk(im)) { const x = el('img'); x.src = im; x.alt = t; x.loading = 'lazy'; v.append(x); } else { v.textContent = (t || '?')[0]; v.style.background = 'linear-gradient(145deg,' + GRAD[i % 4] + ')'; v.style.display = 'grid'; v.style.placeItems = 'center'; v.style.color = 'rgba(93,58,142,.55)'; v.style.fontFamily = "'Cormorant Garamond',serif"; }
    const b = el('div', 'pb'), m = el('div', 'pm'); m.append(el('span', 0, tg || ''), el('span', 0, y || ''));
    b.append(m, el('h3', 0, t), el('p', 'd', d || ''));
    if (u) { const a = link(tr('view'), u); a.className = 'lnk2'; b.append(a); }
    c.append(v, b); pl2.append(c);
  });
  pr.append(pl2); tools(pr, [['projects', 'projects']]); A.append(pr);
  /* services */
  const sv = el('div', 'band'), sw = el('div', 'w'), ss = sec('services'), sg = el('div', 'sgrid');
  ss.style.padding = 0; ss.classList.remove('w');
  rows(g('services')).forEach(([t, d, it], i) => {
    const c = el('div', 'card'), ul = el('ul'); (it || '').split(';').forEach(x => ul.append(el('li', 0, x.trim())));
    c.append(el('span', 'n', '0' + (i + 1)), el('h3', 0, t), el('p', 0, d || ''), ul); sg.append(c);
  });
  ss.append(sg); tools(ss, [['services', 'services']]); sw.append(ss); sv.append(sw); A.append(sv);
  /* certificates */
  const cs = sec('certificates'), cg = el('div', 'cgrid');
  rowsL('certs').forEach(([n, is, dt, u, im]) => {
    const c = el('div', 'card cert');
    if (imgOk(im)) { const x = el('img'); x.src = im; x.alt = n; x.loading = 'lazy'; c.append(x); }
    c.append(el('h3', 0, n), el('p', 0, [is, dt].filter(Boolean).join(' · ')));
    if (u) { const a = link(tr('cred'), u); a.className = 'lnk2'; c.append(a); }
    cg.append(c);
  });
  cs.append(cg); tools(cs, [['certs', 'certificates']]); A.append(cs);
  /* journey */
  const jn = sec('journey'), jg = el('div', 'jgrid');
  const c1 = el('div', 'card'), c2 = el('div', 'card');
  c1.append(el('h3', 0, tr('exp'))); c2.append(el('h3', 0, tr('edu')));
  rows(g('experience')).forEach(([r, co, dt, d]) => { const i = el('div', 'it'), s = el('small', 0, [co, dt].filter(Boolean).join(' · ')); i.append(el('b', 0, r), s, el('p', 0, d || '')); c1.append(i); });
  rows(g('education')).forEach(([r, sc, dt]) => { const i = el('div', 'it'), s = el('small', 0, [sc, dt].filter(Boolean).join(' · ')); i.append(el('b', 0, r), s); c2.append(i); });
  jg.append(c1, c2); jn.append(jg); tools(jn, [['experience', 'experience'], ['education', 'education']]); A.append(jn);
  /* contact */
  const ct = el('div', 'contact'), cw = el('div', 'w two'), cl = el('div'), cr = rowsL('contact'), mail = (cr[0] || [])[2] || '';
  ct.id = 'contact'; const ch2 = el('h2', 'serif'); ch2.style.cssText = 'font-size:clamp(2.4rem,5.5vw,4rem)'; ch2.append(((T.contact || [])[2] || '') + ' ', el('span', 'vi', (T.contact || [])[3] || ''));
  const lead = el('p', 'lead', M[3] || '');
  const m = link((cr[0] || [])[1] || '', mail); m.className = 'mail'; const so = el('div', 'soc'); cr.slice(1).forEach(r => so.append(link(r[1] + ' ↗', r[2])));
  cl.append(el('p', 'eb', (T.contact || [])[1] || ''), ch2, lead, m, so); tools(cl, [['contact', 'contact']]);
  const f = el('form'); f.innerHTML = '<h3>' + tr('f_title') + '</h3><label for="fn">' + tr('f_name') + '</label><input id="fn" required><label for="fe">' + tr('f_email') + '</label><input id="fe" type="email" required><label for="fs">' + tr('f_about') + '</label><select id="fs"><option>' + tr('f_o1') + '</option><option>' + tr('f_o2') + '</option><option>' + tr('f_o3') + '</option></select><label for="fm">' + tr('f_msg') + '</label><textarea id="fm" required></textarea><p class="small">' + tr('f_note') + '</p>';
  const send = el('button', 0, tr('f_send')); send.type = 'submit'; send.style.marginTop = '14px'; f.append(send);
  f.onsubmit = e => {
    e.preventDefault(); const to = mail.replace(/^mailto:/i, ''); if (!/^[^\s?&]+@[^\s?&]+$/.test(to)) return;
    location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(tr('subj') + $('#fn').value) + '&body=' + encodeURIComponent($('#fm').value + '\n\n' + $('#fn').value + ' (' + $('#fe').value + ')\n' + $('#fs').value);
  };
  cw.append(cl, f); ct.append(cw); A.append(ct);
  $('#loginBtn').textContent = admin ? 'Log out' : '•'; $('#loginBtn').classList.toggle('on', admin); document.documentElement.lang = L; $('#lang').textContent = tr('lang'); $('#lang').title = L === 'en' ? 'Shqip' : 'English'; document.querySelectorAll('[data-i]').forEach(e => e.textContent = tr(e.dataset.i)); $('#bar').textContent = admin ? 'Edit mode is on' : ''; $('#fl').textContent = M[4] || '';
}

function editor(k) {
  const d = $('#dlg'); d.replaceChildren();
  const kk = k + (L === 'sq' ? '_sq' : ''); const ta = el('textarea'); ta.value = data[kk] ?? data[k]; ta.id = 'ta';
  const msg = el('p', 'msg'), save = el('button', 0, 'Save changes'), cancel = el('button', 'alt', 'Cancel');
  cancel.onclick = () => d.close();
  save.onclick = async () => {
    msg.textContent = '';
    const { error } = await sb.from('content').upsert({ key: kk, value: { text: ta.value }, updated_at: new Date().toISOString() });
    if (error) { msg.textContent = 'Could not save: ' + error.message; return; }
    data[kk] = ta.value; render(); d.close();
  };
  const r = el('div', 'row'); r.append(cancel, save);
  const lb = el('label', 0, 'Edit ' + k + (L === 'sq' ? ' (Shqip)' : ' (English)')); lb.htmlFor = 'ta';
  const bx = el('div');
  if (['projects', 'certs', 'hero'].includes(k)) {
    const l = el('label', 0, 'Upload a photo (first click in the text where the link should go)'); l.htmlFor = 'up';
    const up = el('input'); up.type = 'file'; up.id = 'up'; up.accept = 'image/jpeg,image/png,image/webp';
    up.onchange = async () => {
      const f = up.files[0]; if (!f) return;
      if (f.size > 3e6) { msg.textContent = 'This image is larger than 3 MB. Choose a smaller one.'; return; }
      const nm = Date.now() + '-' + f.name.replace(/[^\w.\-]/g, '_');
      const { error } = await sb.storage.from('images').upload(nm, f, { contentType: f.type });
      if (error) { msg.textContent = 'Upload failed: ' + error.message; return; }
      const u = sb.storage.from('images').getPublicUrl(nm).data.publicUrl;
      ta.setRangeText(u, ta.selectionStart, ta.selectionEnd, 'end'); ta.focus(); msg.textContent = 'Photo link added at your cursor. Press Save changes.';
    };
    bx.append(l, up);
  }
  d.append(el('h3', 0, 'Edit section'), lb, ta, el('p', 'hint', HINT[k] + (L === 'sq' ? ' In Shqip, you can leave links and photos empty: the English ones are used.' : '')), bx, msg, r); d.showModal();
}

function loginDialog() {
  const d = $('#dlg'); d.replaceChildren();
  const e = el('input'), p = el('input'), msg = el('p', 'msg');
  e.type = 'email'; e.id = 'em'; e.autocomplete = 'username'; p.type = 'password'; p.id = 'pw'; p.autocomplete = 'current-password';
  const go = el('button', 0, 'Log in'), cancel = el('button', 'alt', 'Cancel');
  cancel.onclick = () => d.close();
  go.onclick = async () => {
    if (!sb) { msg.textContent = 'Add your Supabase URL and key in index.html first.'; return; }
    const { error } = await sb.auth.signInWithPassword({ email: e.value, password: p.value });
    if (error) { msg.textContent = 'Wrong email or password.'; return; }
    d.close();
  };
  const l1 = el('label', 0, 'Email'); l1.htmlFor = 'em'; const l2 = el('label', 0, 'Password'); l2.htmlFor = 'pw';
  const r = el('div', 'row'); r.append(cancel, go);
  d.append(el('h3', 0, 'Admin login'), l1, e, l2, p, msg, r); d.showModal();
}

$('#loginBtn').onclick = async () => { if (admin) await sb.auth.signOut(); else loginDialog(); };
$('#lang').onclick = () => { L = L === 'en' ? 'sq' : 'en'; try { localStorage.setItem('lang', L); } catch (e) {} render(); };
$('#yr').textContent = new Date().getFullYear();

(async () => {
  if (sb) {
    try {
      const { data: rowsDb } = await sb.from('content').select('key,value');
      (rowsDb || []).forEach(r => { if (r.value && typeof r.value.text === 'string') data[r.key] = r.value.text; });
    } catch (e) { /* keep defaults */ }
    const { data: s } = await sb.auth.getSession(); admin = !!s.session;
    sb.auth.onAuthStateChange((_e, sess) => { admin = !!sess; render(); });
  }
  render();
  if (location.hash === '#admin') loginDialog();
})();
</script>
